<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#26282b;--card:#33363a;--ink:#f2efec;--muted:#b4aea8;--line:#4a4e53;--accent:#ff7a1a;--accent-ink:#1d1f21;
  --del-bg:rgba(255,92,92,.28);--del-ink:#ffb4b4;--ins-bg:rgba(72,200,120,.28);--ins-ink:#a6f0c2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;line-height:1.7;overflow:auto}
main{max-width:640px;margin:0 auto;padding:8px 16px 12px;height:100%;display:flex;flex-direction:column;min-height:480px}
.logo{display:block;height:56px;width:auto;margin:0 auto;flex:none}
h1{font-size:1.5rem;font-weight:700;text-align:center;margin:2px 0 2px;letter-spacing:.04em;color:var(--accent);flex:none}
.lab{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin:6px 0 3px;flex:none;font-size:.95rem}
.lab small{font-weight:400;color:var(--muted);font-size:.8rem}
.box{width:100%;flex:1 1 0;min-height:56px;overflow:auto;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:none;text-align:start;unicode-bidi:plaintext}
#res{white-space:pre-wrap;word-wrap:break-word}
.del{background:var(--del-bg);color:var(--del-ink);text-decoration:line-through;border-radius:4px}
.ins{background:var(--ins-bg);color:var(--ins-ink);border-radius:4px}
.key{display:inline-block;padding:0 7px;border-radius:4px;font-size:.75rem;margin-inline-start:6px}
.row{display:flex;gap:8px;margin-top:8px;align-items:center;flex:none}
#sum{flex:1;color:var(--muted);font-size:.85rem;text-align:left}
#sum b{color:var(--accent)}
button{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

<h1>Text Diff</h1>

<div class="lab"><label for="a">Text 1</label></div>
<textarea id="a" class="box" dir="auto" placeholder="insert the first text..."></textarea>

<div class="lab"><label for="b">Text 2</label></div>
<textarea id="b" class="box" dir="auto" placeholder="insert the second text..."></textarea>

<div class="lab"><span>Differences</span>
  <small><span class="key del">removed</span><span class="key ins">added</span></small></div>
<div id="res" class="box" dir="auto" aria-live="polite"></div>

<div class="row">
  <div id="sum"></div>
  <button id="swap" title="Swap texts" aria-label="Swap texts">
    <svg viewBox="0 0 24 24"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
  </button>
  <button class="main" id="clear" title="Clear" aria-label="Clear">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
  </button>
</div>
</main>
<script>
var A=document.getElementById("a"), B=document.getElementById("b"),
    RES=document.getElementById("res"), SUM=document.getElementById("sum");
var TOK=/[\p{L}\p{N}_\u200c]+|[^\s\p{L}\p{N}_\u200c]/gu;

// Split text into tokens (words or single punctuation marks). Each token remembers the spaces after it.
function tokenize(s){
  var out=[], lead="", m, last=0, first=true;
  var re=new RegExp(TOK.source,"gu");
  while((m=re.exec(s))){
    var ws=/^\s*/.exec(s.slice(re.lastIndex))[0];
    if(first){lead=s.slice(0,m.index);first=false}
    out.push({t:m[0],ws:ws});
    re.lastIndex+=ws.length;
  }
  if(first)lead=s;
  return {lead:lead,toks:out};
}

// Longest-common-subsequence diff: returns [{k:"=",tok},{k:"-",tok},{k:"+",tok}]
function diff(a,b,same){
  var pre=0;
  while(pre<a.length&&pre<b.length&&same(a[pre],b[pre]))pre++;
  var ea=a.length,eb=b.length;
  while(ea>pre&&eb>pre&&same(a[ea-1],b[eb-1])){ea--;eb--}
  var n=ea-pre,m=eb-pre,ops=[],i,j;
  for(i=0;i<pre;i++)ops.push({k:"=",a:a[i],b:b[i]});
  if(n*m>16e6)return null;
  var w=m+1, dp=new Uint16Array((n+1)*w);
  for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--){
    dp[i*w+j]=same(a[pre+i],b[pre+j])?dp[(i+1)*w+j+1]+1:Math.max(dp[(i+1)*w+j],dp[i*w+j+1]);
  }
  i=0;j=0;
  while(i<n&&j<m){
    if(same(a[pre+i],b[pre+j])){ops.push({k:"=",a:a[pre+i],b:b[pre+j]});i++;j++}
    else if(dp[(i+1)*w+j]>=dp[i*w+j+1]){ops.push({k:"-",a:a[pre+i]});i++}
    else{ops.push({k:"+",b:b[pre+j]});j++}
  }
  while(i<n){ops.push({k:"-",a:a[pre+i]});i++}
  while(j<m){ops.push({k:"+",b:b[pre+j]});j++}
  for(i=ea;i<a.length;i++)ops.push({k:"=",a:a[i],b:b[eb+(i-ea)]});
  return ops;
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function render(){
  var ta=A.value, tb=B.value;
  if(!ta&&!tb){RES.innerHTML="";SUM.textContent="";return}
  var pa=tokenize(ta), pb=tokenize(tb);
  var ops=diff(pa.toks,pb.toks,function(x,y){return x.t===y.t});
  if(!ops){RES.textContent="";SUM.textContent="Texts are too long to compare.";return}
  var html=esc(pb.lead), del=0, ins=0, i=0;
  while(i<ops.length){
    var k=ops[i].k, text="";
    var j=i;
    while(j<ops.length&&ops[j].k===k){
      var o=ops[j];
      if(k==="-"){text+=o.a.t+o.a.ws;del++}
      else if(k==="+"){text+=o.b.t+o.b.ws;ins++}
      else text+=o.b.t+o.b.ws;
      j++;
    }
    if(k==="="){html+=esc(text)}
    else{
      var tail=/\s*$/.exec(text)[0], core=text.slice(0,text.length-tail.length);
      html+='<span class="'+(k==="-"?"del":"ins")+'">'+esc(core)+"</span>"+esc(tail);
    }
    i=j;
  }
  RES.innerHTML=html;
  SUM.innerHTML=(del||ins)?("<b>"+del+"</b> removed &middot; <b>"+ins+"</b> added"):(ta||tb?"The texts are identical.":"");
}

A.addEventListener("input",render);B.addEventListener("input",render);
document.getElementById("swap").onclick=function(){var t=A.value;A.value=B.value;B.value=t;render()};
document.getElementById("clear").onclick=function(){A.value="";B.value="";render();A.focus()};
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('diff-sw.js')}catch(e){}})}
</script>
</body>
